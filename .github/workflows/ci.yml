name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: make check
        run: make check
      - name: Bundle the app (universal)
        run: scripts/build-app.sh --universal
